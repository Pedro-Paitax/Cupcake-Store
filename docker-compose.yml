# Ambiente de produção na VM Oracle: API + PostgreSQL + túnel Cloudflare.
# Não publica portas para a internet: o tráfego entra só pelo túnel.
# Variáveis ficam no arquivo .env do servidor (nunca no Git).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cupcakestore
      POSTGRES_USER: cupcake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    expose:
      - "8080"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
