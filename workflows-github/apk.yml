name: App - gerar APK Android

# Gera o APK do app MAUI sem precisar do Visual Studio.
# Rodar manualmente: aba Actions → "App - gerar APK Android" → Run workflow.
# Ao criar uma tag (ex.: v1.0.0) o APK também é anexado a uma Release para os testadores baixarem.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Publicar APK (assinado com chave de debug)
        run: >
          dotnet publish CardapioCupCake/CardapioCupCake.csproj
          -f net9.0-android -c Release
          -p:TargetFrameworks=net9.0-android
          -p:AndroidPackageFormat=apk
          -o publicado

      - name: Renomear APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem publicado -Filter *-Signed.apk | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem publicado -Filter *.apk | Select-Object -First 1 }
          Copy-Item $apk.FullName CupcakeStore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CupcakeStore-apk
          path: CupcakeStore.apk

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CupcakeStore.apk
          body: |
            APK de teste do Cupcake Store.
            Instalação: baixe no celular Android e permita "instalar apps de fontes desconhecidas".
